name: Build Android APK

on:
  push:
    workflow_dispatch:
 build-android:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_VERSION_TAG: "4.7.2-stable"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y unzip wget

      - name: Download Godot editor and Android templates
        run: |
          mkdir -p "$HOME/godot"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/godot"
          mv "$HOME/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" "$HOME/godot/godot"
          chmod +x "$HOME/godot/godot"

          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O /tmp/templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Extract Godot project
        run: |
          mkdir -p project
          unzip -q RPGOffline_Godot_Project.zip -d project
          test -f project/project.godot

      - name: Create Android export preset
        working-directory: project
        run: |
          cat > export_presets.cfg <<'PRESETS'
          [preset.0]
          name="Android"
          platform="Android"
          runnable=true
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/RPGOffline-debug.apk"
          patch_list=PackedStringArray()
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]
          custom_template/debug=""
          custom_template/release=""
          gradle_build/use_gradle_build=false
          architectures/armeabi-v7a=false
          architectures/arm64-v8a=true
          package/unique_name="com.tuestudio.rpgoffline"
          package/name="RPG Offline"
          package/version="0.1.0"
          screen/orientation=0
          PRESETS

      - name: Validate Godot project
        run: "$HOME/godot/godot --headless --path project --editor --quit"

      - name: Export debug APK
        run: |
          mkdir -p project/build
          "$HOME/godot/godot" --headless --path project --export-debug "Android" project/build/RPGOffline-debug.apk
          test -s project/build/RPGOffline-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RPGOffline-debug-apk
          path: project/build/RPGOffline-debug.apk
          if-no-files-found: error
